# Every push is checked the way the deploy image builds it: rules, then the production build.
# Failures surface as file/line annotations on the commit, readable through the checks API.
name: check
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rules
        run: node scripts/check-rules.mjs
      - name: Build
        shell: bash
        run: npx next build 2>&1 | node scripts/annotate-build.mjs
      - name: Smoke
        shell: bash
        run: |
          npx next start -p 3000 -H 127.0.0.1 > /tmp/next.log 2>&1 &
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          npm i --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs http://127.0.0.1:3000
